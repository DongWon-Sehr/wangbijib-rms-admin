<!-- ViewLogin.html (로그인 화면) -->
<div class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-gray-50 to-gray-200">
  <div class="max-w-md w-full bg-white p-8 sm:p-10 rounded-2xl shadow-2xl border border-gray-100 text-center relative overflow-hidden">
    
    <!-- Top Decorative Line -->
    <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-primary-600 via-primary-500 to-amber-500"></div>

    <!-- Logo / Icon -->
    <div class="mb-6 flex flex-col items-center">
      <img v-if="appLogo" :src="appLogo" alt="왕비집 BI" class="h-16 w-auto object-contain mb-2">
      <div v-else class="w-16 h-16 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center mb-2 shadow-inner border border-primary-100">
        <i class="ph ph-crown-simple text-4xl text-amber-500"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">왕비집 예약관리 시스템</h1>
      <p class="text-xs text-primary-700 font-semibold tracking-widest uppercase mt-1">PREMIUM DINING RMS</p>
    </div>

    <!-- Instructions -->
    <p class="text-sm text-gray-500 mb-6 leading-relaxed">
      등록된 관리자 및 직원 계정의 이메일을 입력하여 로그인하세요.
    </p>

    <!-- Error Alert -->
    <div v-if="loginError" class="mb-5 p-3.5 bg-red-50 border border-red-200 rounded-xl text-left flex items-start gap-2.5">
      <i class="ph ph-warning-circle text-red-600 text-lg flex-shrink-0 mt-0.5"></i>
      <div class="text-xs text-red-700 font-medium leading-relaxed">{{ loginError }}</div>
    </div>

    <!-- Login Form -->
    <form @submit.prevent="handleLogin" class="space-y-4 text-left">
      <div>
        <label for="login-email" class="block text-xs font-bold text-gray-700 mb-1.5">이메일 주소</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
            <i class="ph ph-envelope-simple text-lg"></i>
          </div>
          <input
            id="login-email"
            type="email"
            v-model="loginEmail"
            :disabled="isLoggingIn"
            required
            autocomplete="email"
            placeholder="예: dongwon.sehr@gmail.com"
            class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:bg-white transition"
          />
        </div>
      </div>

      <button
        type="submit"
        :disabled="isLoggingIn || !loginEmail"
        class="w-full py-3.5 px-4 bg-primary-600 hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm"
      >
        <i v-if="isLoggingIn" class="ph ph-spinner animate-spin text-lg"></i>
        <i v-else class="ph ph-sign-in text-lg"></i>
        <span>{{ isLoggingIn ? '로그인 확인 중...' : '시스템 접속' }}</span>
      </button>
    </form>

    <!-- Footer Note -->
    <div class="mt-8 pt-6 border-t border-gray-100 text-center">
      <p class="text-[11px] text-gray-400">
        계정 등록 및 권한 문의는 시스템 관리자에게 문의해 주세요.
      </p>
    </div>

  </div>
</div>
