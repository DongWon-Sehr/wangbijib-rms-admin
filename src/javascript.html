  // All dates are interpreted/displayed in the app's fixed timezone (KST), regardless of browser timezone
  const APP_TZ_OFFSET_HOURS = 9;
  const APP_TZ_OFFSET_MS = APP_TZ_OFFSET_HOURS * 60 * 60 * 1000;
  const APP_TZ_SUFFIX = '+09:00';

  const Util = {
    TZ_OFFSET_MS: APP_TZ_OFFSET_MS,
    TZ_SUFFIX: APP_TZ_SUFFIX,
    parseInAppTz: function(dateStr, timeStr) {
      return Date.parse(dateStr + 'T' + (timeStr || '00:00') + ':00' + APP_TZ_SUFFIX);
    },
    formatDate: function(value, type) {
      if (!type) type = 'datetime';
      if (!value) return '';
      try {
        if (typeof value === 'string' && /^\d{2}:\d{2}(:\d{2})?$/.test(value)) {
          return type === 'time' ? value.slice(0, 5) : String(value);
        }
        const parsed = new Date(value);
        if (isNaN(parsed.getTime())) return String(value);
        const date = new Date(parsed.getTime() + APP_TZ_OFFSET_MS);
        const y = date.getUTCFullYear();
        const m = String(date.getUTCMonth() + 1).padStart(2, '0');
        const d = String(date.getUTCDate()).padStart(2, '0');
        const hh = String(date.getUTCHours()).padStart(2, '0');
        const mm = String(date.getUTCMinutes()).padStart(2, '0');
        
        if (type === 'date') return y + '-' + m + '-' + d;
        if (type === 'time') return hh + ':' + mm;
        if (type === 'kakao') return m + '/' + d + ' ' + hh + ':' + mm;
        return y + '-' + m + '-' + d + ' ' + hh + ':' + mm;
      } catch (e) { return String(value); }
    },
    addDays: function(date, days) {
      return new Date(new Date(date).getTime() + days * 24 * 60 * 60 * 1000);
    },
    safeChar: function(str, index) {
      if (!index) index = 0;
      if (!str) return '';
      return String(str).charAt(index);
    },
    collapseBlankLines: function(text) {
      if (typeof text !== 'string') return text;
      return text.replace(/\r\n?/g, '\n').replace(/(?:[ \t]*\n){2,}/g, '\n').trim();
    },
    base64EncodeWebSafe: function(str) {
      return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  };

          isPulling.value = false; // scrolling down

        if (!isPulling.value) return;

      // 예약어 삽입 버튼 노출 순서: 고객/예약 → 지점 → 예약금 → 대체 지점 → 중복 예약

        const finalize = () => {
          isLoading.value = false;
          loadingMessage.value = ''; // 여기서 초기화
        };

        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((res) => {
              finalize();
              // res가 null이면 서버 응답 직렬화 실패(Date 객체 포함 등)

      const getUserRoleBadge = (r) => ({'admin':'bg-red-700 text-white','manager':'bg-amber-100 text-amber-800','viewer':'bg-gray-200 text-gray-800'})[r] || 'bg-gray-100';

      const createUpdatePayload = (res) => ({

      // ============================================================

      const branchMapKo = computed(() => branches.value.reduce((m, b) => { m[b.id] = b.branch_name_ko; return m; }, {}));
      const branchMapEn = computed(() => branches.value.reduce((m, b) => { m[b.id] = b.branch_name_en; return m; }, {}));

      // --- 이메일 형식, 도메인 오타 및 반송(Bounce) 검증 ---
      const EMAIL_TYPO_MAP = {
        'gmial.com': 'gmail.com',
        'gamil.com': 'gmail.com',
        'gmai.com': 'gmail.com',
        'gmaill.com': 'gmail.com',
        'gmaik.com': 'gmail.com',

        'icould.com': 'icloud.com',

        'homail.com': 'hotmail.com',

        'yaho.com': 'yahoo.com'

      const bouncedThreadsSet = computed(() => new Set((bouncedEmailsData.value || []).map(b => b.threadId).filter(Boolean)));
      const bouncedEmailsSet = computed(() => new Set((bouncedEmailsData.value || []).map(b => (b.recipientEmail || '').trim().toLowerCase()).filter(Boolean)));

      const isBouncedReservation = (r) => {
        if (!r) return false;
        if (r.email_thread_id && bouncedThreadsSet.value.has(r.email_thread_id)) return true;
        const norm = (r.email || '').trim().toLowerCase();
        if (norm && bouncedEmailsSet.value.has(norm)) return true;
        return false;
      };

      const validateEmail = (email) => {
        if (!email || typeof email !== 'string') return { isValid: true, message: '', suggestion: null };
        const trimmed = email.trim();
        if (!trimmed) return { isValid: true, message: '', suggestion: null };

        const syntaxRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
        if (!syntaxRegex.test(trimmed)) {
          return { isValid: false, message: '이메일 형식 오류 (@ 또는 도메인 누락)', suggestion: null };
        }

        const parts = trimmed.split('@');
        if (parts.length === 2) {
          const domain = parts[1].toLowerCase();
          if (EMAIL_TYPO_MAP[domain]) {
            const suggestedDomain = EMAIL_TYPO_MAP[domain];
            return {
              isValid: false,
              message: `도메인 오타 의심 (@${domain} → @${suggestedDomain})`,
              suggestion: `${parts[0]}@${suggestedDomain}`
            };
          }
        }
        return { isValid: true, message: '', suggestion: null };
      };

      // 이메일 오류 종합 판별 (형식 오류, 도메인 오타, 또는 발송 실패 반송)
      const getReservationEmailError = (r) => {
        if (!r) return null;
        if (isBouncedReservation(r)) {
          return {
            type: 'bounce',
            label: '발송 실패 (반송됨)',
            message: '메일 발송 실패 (반송: 없는 계정 또는 수신 거부)',
            suggestion: null
          };
        }
        const val = validateEmail(r.email);
        if (!val.isValid) {
          return {
            type: val.suggestion ? 'typo' : 'format',
            label: val.suggestion ? '오타 감지' : '형식 오류',
            message: val.message,
            suggestion: val.suggestion
          };
        }
        return null;
      };

      const hasReservationEmailError = (r) => !!getReservationEmailError(r);

      const hasEmailError = (arg) => {
        if (!arg) return false;
        if (typeof arg === 'object') {
          return hasReservationEmailError(arg);
        }
        const norm = String(arg).trim().toLowerCase();
        if (bouncedEmailsSet.value.has(norm)) return true;
        return !validateEmail(arg).isValid;
      };

      const getEmailErrorMsg = (arg) => {
        if (!arg) return '';
        if (typeof arg === 'object') {
          return getReservationEmailError(arg)?.message || '';
        }
        const norm = String(arg).trim().toLowerCase();
        if (bouncedEmailsSet.value.has(norm)) {
          return '메일 발송 실패 (반송: 없는 계정 또는 수신 거부)';
        }
        return validateEmail(arg).message || '';
      };

      const getEmailSuggestion = (email) => validateEmail(email).suggestion || null;
      const getNormalizedEmail = (email) => {
        if (!email || typeof email !== 'string') return '';
        const trimmed = email.trim().toLowerCase();
        const suggestion = getEmailSuggestion(trimmed);
        if (suggestion) return suggestion.trim().toLowerCase();
        return trimmed;
      };

      const activeReservationEmailSuggestion = computed(() => {
        if (!activeReservation.value || !activeReservation.value.email) return null;
        return getEmailSuggestion(activeReservation.value.email);
      });

      const activeReservationIsBounced = computed(() => {
        if (!activeReservation.value) return false;
        return isBouncedReservation(activeReservation.value);
      });

      const activeReservationEmailError = computed(() => {
        if (!activeReservation.value) return null;
        return getReservationEmailError(activeReservation.value);
      });

      const applyEmailSuggestion = (suggestion) => {
        if (activeReservation.value && suggestion) {
          activeReservation.value.email = suggestion;
          showToast('추천 이메일 주소가 입력창에 반영되었습니다');
        }
      };

      // 미래 비취소 예약 중 이메일 오류(오타 또는 반송)가 있는 목록
      const emailErrorReservations = computed(() => {
        const list = reservations.value || [];
        const todayStartMs = new Date().setHours(0, 0, 0, 0);
        return list.filter(r => {
          if (r.status === 'cancel') return false;
          const rDate = new Date(r.reservation_date);
          if (!isNaN(rDate.getTime()) && rDate.getTime() < todayStartMs) return false;
          return hasReservationEmailError(r);
        });
      });

      // --- 중복 예약 그룹화 알고리즘 (Disjoint-Set Connected Components) ---
      const duplicateGroups = computed(() => {
        const allRes = reservations.value || [];
        const groupsData = duplicateGroupsData.value || [];
        const resMap = {};
        allRes.forEach(r => { resMap[r.id] = r; });

        const finalGroups = [];

        groupsData.forEach(g => {
          if (g.status !== 'active') return;

          const pIds = g.parsed_ids || (g.reservation_ids ? String(g.reservation_ids).split(',').map(s => s.trim()).filter(Boolean) : []);
          // 취소(cancel)되지 않은 유효 예약만 필터링 (Optimistic UI 즉시 반영)
          const validMembers = pIds.map(id => resMap[id]).filter(r => r && r.status !== 'cancel');

          // 남은 유효 예약이 2건 이상인 경우만 중복 그룹으로 표시
          if (validMembers.length >= 2) {
            let matchReasons = [];
            if (g.group_type === 'manual') {
              matchReasons = ['수동 지정'];
            } else {
              // 예약 간 중복 사유 계산
              const reasonsSet = new Set();
              for (let i = 0; i < validMembers.length; i++) {
                for (let j = i + 1; j < validMembers.length; j++) {
                  const a = validMembers[i];
                  const b = validMembers[j];
                  const emailA = (a.email || '').trim().toLowerCase();
                  const emailB = (b.email || '').trim().toLowerCase();
                  const normA = getNormalizedEmail(a.email);
                  const normB = getNormalizedEmail(b.email);
                  if (emailA && emailB && (emailA === emailB || (normA && normB && normA === normB))) {
                    reasonsSet.add(emailA === emailB ? '동일 이메일' : `이메일 오타 유사 (${normA})`);
                  }
                  const nameA = (a.customer_name || '').trim().toLowerCase();
                  const nameB = (b.customer_name || '').trim().toLowerCase();
                  if (nameA && nameB && nameA.length >= 2 && nameA === nameB) {
                    reasonsSet.add('동일 고객명');
                  }
                  const phoneA = (a.phone_number || '').replace(/\D/g, '');
                  const phoneB = (b.phone_number || '').replace(/\D/g, '');
                  if (phoneA && phoneB && phoneA.length >= 8 && phoneA === phoneB) {
                    reasonsSet.add('동일 전화번호');
                  }
                }
              }
              matchReasons = Array.from(reasonsSet);
              if (matchReasons.length === 0) {
                // 더 이상 중복 사유가 없는 자동 감지 그룹은 Optimistic UI 상에서 제외
                return;
              }
            }

            finalGroups.push({
              id: g.id,
              group_id: g.group_id || g.id,
              group_type: g.group_type || 'auto',
              status: 'active',
              match_reasons: matchReasons,
              matchLabel: matchReasons.join(', '),
              title: `${validMembers[0]?.customer_name || '고객'} (${validMembers.length}건)`,
              reservations: validMembers,
              notes: g.notes || '',
              created_at: g.created_at || validMembers[0]?.created_at,
              mail_sent_at: g.mail_sent_at || null
            });
          }
        });

        // 방문일자 빠른 순으로 정렬
        finalGroups.sort((g1, g2) => {
          const t1 = Math.min(...g1.reservations.map(r => new Date(r.reservation_date).getTime() || 0));
          const t2 = Math.min(...g2.reservations.map(r => new Date(r.reservation_date).getTime() || 0));
          return t1 - t2;
        });

        return finalGroups;
      });

      const duplicateGroupTotalCount = computed(() => duplicateGroups.value.length);
      const duplicateGroupMap = computed(() => {
        const map = {};
        duplicateGroups.value.forEach(group => {
          (group.reservations || []).forEach(r => {
            map[r.id] = group;
          });
        });
        return map;
      });
      const activeReservationDuplicateGroup = computed(() => {
        if (!activeReservation.value) return null;
        return duplicateGroupMap.value[activeReservation.value.id] || null;
      });

      const isAllVisibleSelected = computed(() => {
        const list = filterIssueType.value === 'email_error' ? emailErrorReservations.value : paginatedReservations.value;
        if (!list || list.length === 0) return false;
        return list.every(r => selectedReservationIds.value.includes(r.id));
      });

      const toggleSelectAllVisible = () => {
        const list = filterIssueType.value === 'email_error' ? emailErrorReservations.value : paginatedReservations.value;
        if (isAllVisibleSelected.value) {
          const listIds = new Set(list.map(r => r.id));
          selectedReservationIds.value = selectedReservationIds.value.filter(id => !listIds.has(id));
        } else {
          const newSet = new Set(selectedReservationIds.value);
          list.forEach(r => newSet.add(r.id));
          selectedReservationIds.value = Array.from(newSet);
        }
      };

      const toggleIssueFilter = (type) => {
        if (filterIssueType.value === type) {
          filterIssueType.value = 'all';
        } else {
          filterIssueType.value = type;
          currentPage.value = 1;
        }
      };

      const notifications = computed(() => {
        const list = [];
        const nowMs = now.value.getTime();

        // 1. [중복 의심] 그룹 알림
        duplicateGroups.value.forEach(group => {
          const earliestTime = Math.min(...group.reservations.map(r => new Date(r.reservation_date).getTime() || nowMs));
          list.push({
            id: 'dup_' + group.id,
            type: 'duplicate',
            types: ['duplicate'],
            primaryType: 'duplicate',
            group: group,
            subCount: group.reservations.length,
            desc: `${group.reservations[0]?.customer_name || '고객'} 외 ${group.reservations.length - 1}건 중복 의심`,
            timeText: `${group.reservations.length}건 예약 겹침`,
            sortTime: earliestTime
          });
        });

        // 2. [이메일 오류] 단건 알림
        emailErrorReservations.value.forEach(res => {
          const resTime = new Date(res.reservation_date);
          const resMs = !isNaN(resTime.getTime()) ? resTime.getTime() : nowMs;
          const errorMsg = getEmailErrorMsg(res.email);
          const suggestion = getEmailSuggestion(res.email);
          list.push({
            id: 'email_err_' + res.id,
            type: 'email_error',
            types: ['email_error'],
            primaryType: 'email_error',
            reservation: res,
            errorMsg: errorMsg,
            suggestion: suggestion,
            desc: `${res.customer_name} | ${res.email}`,
            timeText: errorMsg,
            sortTime: resMs
          });
        });

        // 3. 기존 일반 예약 알림 건 (pending, deposit, imminent, refund)
        (reservations.value || []).forEach(res => {
          if (res.status === 'cancel') return;
          
          const resTime = new Date(res.reservation_date);
          if (isNaN(resTime.getTime())) return;
          const resMs = resTime.getTime();

          const types = [];

          // 1. [대기] 미래 대기 예약 건
          if (resMs > nowMs && res.status === 'pending') {
            types.push('pending');
          }

          // 2. [예약금] 미래 예약금 입금 대기 건
          if (resMs > nowMs && res.deposit_status === 'pending') {
            types.push('deposit');
          }

          // 3. [임박] 6시간 이내 임박 건
          const diffMs = resMs - nowMs;
          let leftTimeText = '';
          if (res.status === 'pending' && diffMs >= 0 && diffMs <= 6 * 60 * 60 * 1000) {
            types.push('imminent');
            const diffMin = Math.round(diffMs / 60000);
            if (diffMin < 60) {
              leftTimeText = `${diffMin}분 남음`;
            } else {
              leftTimeText = `${Math.floor(diffMin / 60)}시간 ${diffMin % 60}분 남음`;
            }
          }

          // 4. [환불] 이용기간이 경과했으나 예약금이 완료(confirm) 상태인 건
          if (resMs < nowMs && res.deposit_status === 'confirm') {
            types.push('refund');
          }

          if (types.length > 0) {
            let primaryType = 'refund';
            if (types.includes('imminent')) {
              primaryType = 'imminent';
            } else if (types.includes('pending')) {
              primaryType = 'pending';
            } else if (types.includes('deposit')) {
              primaryType = 'deposit';
            }

            let timeText = '';
            if (types.includes('imminent')) {
              timeText = `${Util.formatDate(resTime, 'time')} (${leftTimeText})`;
            } else {
              timeText = Util.formatDate(resTime, 'datetime');
            }

            list.push({
              id: res.id,
              types: types,
              primaryType: primaryType,
              desc: `${res.customer_name} ${res.pax}명 | ${getBranchName(res.branch_id)}`,
              timeText: timeText,
              sortTime: resMs,
              reservation: res
            });
          }
        });

        // 가까운 방문 예약 시간 순 정렬
        list.sort((a, b) => a.sortTime - b.sortTime);
        return list;
      });

      const notificationCount = computed(() => notifications.value.length);
      
      const slotDefaultsMap = computed(() => {
        const map = {};
        slotDefaults.value.forEach(d => { if(!map[d.branch_id]) map[d.branch_id]={}; map[d.branch_id][d.slot_master_id] = d; });
        return map;
      });
      const slotOverridesMap = computed(() => {
        const map = {};
        slotOverrides.value.forEach(o => {
          const d = Util.formatDate(o.date, 'date');
          if(!map[o.branch_id]) map[o.branch_id]={}; if(!map[o.branch_id][d]) map[o.branch_id][d]={};
          map[o.branch_id][d][o.slot_master_id] = o;
        });
        return map;
      });
      const slotMasterMap = computed(() => slotMasters.value.reduce((m, s) => { m[s.id] = Util.formatDate(s.time, 'time'); return m; }, {}));

      const getSlotTime = (id) => slotMasterMap.value[id] || 'N/A';
      const getSlotInfo = (branchId, masterId, dateStr) => {
        const ov = slotOverridesMap.value[branchId]?.[dateStr]?.[masterId];
        const def = slotDefaultsMap.value[branchId]?.[masterId];
        let val = '-', isOv = false, cls = 'bg-gray-50 text-gray-500';
        if (ov && ov.enabled) { val = ov.slot; isOv = true; cls = 'bg-amber-100 border border-amber-500'; }
        else if (def && def.enabled) { val = def.slot; cls = val > 0 ? 'bg-green-50 border border-green-300' : 'bg-red-50 border border-red-300 text-red-700'; }
        return { value: val, isOverride: isOv, class: cls, isOverrideData: ov };
      };
      const getSlotValue = (b, m, d) => getSlotInfo(b, m, d).value;
      const isSlotOverride = (b, m, d) => getSlotInfo(b, m, d).isOverride;
      const getSlotDisplayClass = (b, m, d) => getSlotInfo(b, m, d).class;

      const slotSettingsBranches = computed(() => {
        if (!branches.value) return [];
        const user = currentUser.value;
        if (!user) return [];
        return branches.value.filter(b => {
          if (b.enabled !== true && String(b.enabled) !== 'true') return false;
          if (user.role === 'admin') return true;
          const allowed = user.allowedBranchIds || [];
          return allowed.includes(b.id);
        });
      });

      const filteredSlotBranches = computed(() => {
        const list = slotSettingsBranches.value;
        if (selectedSlotBranchId.value) {
          return list.filter(b => b.id === selectedSlotBranchId.value);
        }
        return list;
      });

      const activeCalendarId = computed(() => selectedCalendarBranchId.value === 'master' ? 'wangbijib@gmail.com' : branches.value.find(x => x.id === selectedCalendarBranchId.value)?.calendar_id);
      const calendarIframeSrc = computed(() => {
        // 통합(마스터)은 모든 지점 캘린더가 합쳐진 기본 URL 사용
        if (selectedCalendarBranchId.value === 'master') return CALENDAR_URL;
        // 특정 지점 선택 시 해당 지점 캘린더만 임베드
        const calId = activeCalendarId.value;
        if (!calId) return CALENDAR_URL;
        const params = 'ctz=Asia%2FSeoul&wkst=2&hl=ko&mode=MONTH&showPrint=0&showTz=0';
        return 'https://calendar.google.com/calendar/embed?' + params + '&src=' + encodeURIComponent(calId);
      });

      const filteredReservations = computed(() => { 
        let list = reservations.value || [];
        const text = filterText.value.replace(/\s+/g, '').toLowerCase();
        
        if (text) {
          list = list.filter(res => {
            const name = (res.customer_name || '').replace(/\s+/g, '').toLowerCase();
            const email = (res.email || '').replace(/\s+/g, '').toLowerCase();
            const notes = (res.notes || '').replace(/\s+/g, '').toLowerCase();
            const internal = (res.internal_notes || '').replace(/\s+/g, '').toLowerCase();
            const priv = (res.private_notes || '').replace(/\s+/g, '').toLowerCase();
            const id = (res.id || '').replace(/\s+/g, '').toLowerCase();
            return name.includes(text) || email.includes(text) || notes.includes(text) || internal.includes(text) || priv.includes(text) || id.includes(text);
          });
        }
        if (filterStatus.value !== 'all') {
          list = list.filter(r => r.status === filterStatus.value);
        }
        if (filterDeposit.value !== 'all') list = list.filter(r => r.deposit_status === filterDeposit.value);
        if (filterBranchIds.value.length) list = list.filter(r => filterBranchIds.value.includes(r.branch_id));
        if (filterIssueType.value === 'email_error') {
          const errIdSet = new Set(emailErrorReservations.value.map(r => r.id));
          list = list.filter(r => errIdSet.has(r.id));
        }
        if (filterIssueType.value === 'duplicate') {
          list = list.filter(r => duplicateGroupMap.value[r.id]);
        }
        
        const dateCol = filterDateType.value;
        if (filterIssueType.value !== 'email_error' && filterIssueType.value !== 'duplicate') {
          if (filterDateStart.value) {
            const start = Util.parseInAppTz(filterDateStart.value);
            list = list.filter(r => r[dateCol] && new Date(r[dateCol]).getTime() >= start);
          }
          if (filterDateEnd.value) {
            const end = Util.parseInAppTz(filterDateEnd.value) + 24 * 60 * 60 * 1000;
            list = list.filter(r => r[dateCol] && new Date(r[dateCol]).getTime() < end);
          }
        }

        const k = sortKey.value;
        const o = sortOrder.value;
        list.sort((a,b) => {
          let va = a[k], vb = b[k];
          // 지점명 정렬: 예약 객체엔 branch_id만 있으므로 매핑된 한글 지점명으로 비교
          if (k === 'branch_name_ko') { va = branchMapKo.value[a.branch_id] || ''; vb = branchMapKo.value[b.branch_id] || ''; }
          else if (k.includes('date') || k.includes('_at')) { va = va ? new Date(va).getTime() : 0; vb = vb ? new Date(vb).getTime() : 0; }
          if (typeof va === 'string') va = va.toLowerCase(); if (typeof vb === 'string') vb = vb.toLowerCase();
          if (va == null) va = ''; if (vb == null) vb = '';
          if (va < vb) return -1 * o; if (va > vb) return 1 * o;
          return 0;
        });
        return list;
      });
      
      const totalPage = computed(() => Math.ceil(filteredReservations.value.length / itemsPerPage) || 1);
      const paginatedReservations = computed(() => {
        const start = (currentPage.value - 1) * itemsPerPage;
        return filteredReservations.value.slice(start, start + itemsPerPage);
      });
      
      watch(filteredReservations, () => {
        const maxPage = Math.ceil(filteredReservations.value.length / itemsPerPage) || 1;
        if (currentPage.value > maxPage) currentPage.value = 1;
      });

      // Validation
      const isTimeEmpty = computed(() => !localDateTime.time || localDateTime.time === '');
      const isSelectionInvalid = computed(() => {
        if (isTimeEmpty.value || !localDateTime.date || !activeReservation.value || !activeReservation.value.branch_id) return false;
        if (!slotMasters.value) return false;
        const currentBranchId = activeReservation.value.branch_id;
        const currentDate = localDateTime.date;
        const currentTime = localDateTime.time;
        const original = originalReservation.value;
        if (original && original.branch_id === currentBranchId && 
          Util.formatDate(original.reservation_date, 'date') === currentDate &&
          Util.formatDate(original.reservation_date, 'time') === currentTime) {
          return false;
        }
        const master = slotMasters.value.find(s => Util.formatDate(s.time, 'time') === currentTime);
        if (!master) return false;
        const val = getSlotValue(currentBranchId, master.id, currentDate);
        return val <= 0;
      });
      const isPaxInvalid = computed(() => {
        const p = activeReservation.value?.pax;
        return !p || p < 1 || !Number.isInteger(Number(p));
      });
      const isReservationFormValid = computed(() => !isTimeEmpty.value && !isSelectionInvalid.value && !isPaxInvalid.value);

      // 변경사항 존재 여부 (저장 버튼 활성화 + 카톡 전송 전 저장 필요 안내 공용)
      const isReservationDirty = computed(() => {
        if (!activeReservation.value || !originalReservation.value) return false;
        const cur = JSON.stringify(createUpdatePayload(activeReservation.value)) + localDateTime.date + localDateTime.time;
        const orig = JSON.stringify(createUpdatePayload(originalReservation.value)) + Util.formatDate(originalReservation.value.reservation_date, 'date') + Util.formatDate(originalReservation.value.reservation_date, 'time');
        return cur !== orig;
      });

      // Actions
      const openModal = (type, data = null) => {
        if (data) {
          const cloned = JSON.parse(JSON.stringify(data));
          if (type === 'reservation') {
            activeReservation.value = cloned;
            originalReservation.value = JSON.parse(JSON.stringify(data));
            selectedMailTemplateId.value = '';
            selectedAltBranchId.value = '';
            if (cloned.is_read === false) {
              cloned.is_read = true;
              const listItem = reservations.value.find(r => r.id === cloned.id);
              if (listItem) listItem.is_read = true;
              runGoogleScriptSilent('apiMarkReservationAsRead', cloned.id);
            }
          } else if (type === 'system' || type === 'mail') {
            if (type === 'system' && data.mode === 'batch') {
              const isOverride = data.batchType === 'override';
              const targetDate = data.data.date;
              const branchId = data.data.branch_id; 

              cloned.masterSlots = slotMasters.value.map(m => {
                let slotVal = 0;
                let enabledVal = true;
                const def = slotDefaults.value.find(d => d.branch_id === branchId && d.slot_master_id === m.id);
                
                if (isOverride) {
                  const ov = slotOverrides.value.find(o => o.branch_id === branchId && o.slot_master_id === m.id && Util.formatDate(o.date, 'date') === targetDate);
                  if (ov) {
                    slotVal = ov.slot;
                    enabledVal = ov.enabled;
                  } else {
                    if (def) { slotVal = def.slot; }
                    enabledVal = false;
                  }
                } else {
                  if (def) { 
                    slotVal = def.slot; 
                    enabledVal = def.enabled; 
                  }
                }
                
                return { id: m.id, slot: slotVal, enabled: enabledVal };
              });
            }
            activeSystemData.value = cloned;
          }
        }
        modalState[type] = true;
      };
      
      const closeModal = (type) => {
        modalState[type] = false;
        if (type === 'reservation') { activeReservation.value = null; originalReservation.value = null; isStatusDropdownOpen.value = false; }
        if (type === 'system' || type === 'mail') {
           activeSystemData.value = null;
        }
      };

      const setCurrentView = (n) => currentView.value = n;
      const setCurrentViewAndCloseMenu = (n) => { currentView.value = n; isMobileMenuOpen.value = false; };
      const toggleProfileDropdown = (e) => { e.stopPropagation(); isProfileDropdownOpen.value = !isProfileDropdownOpen.value; };
      const toggleNotificationDropdown = (e) => {
        e.stopPropagation();
        isNotificationOpen.value = !isNotificationOpen.value;
        if (isNotificationOpen.value) {
          isProfileDropdownOpen.value = false;
        }
      };
      const toggleMobileMenu = () => { isMobileMenuOpen.value = !isMobileMenuOpen.value; };
      
      const handleNotificationClick = (noti) => {
        isNotificationOpen.value = false;
        if (noti.type === 'duplicate') {
          currentView.value = 'list';
          filterIssueType.value = 'duplicate';
        } else if (noti.type === 'email_error') {
          openModal('reservation', noti.reservation);
        } else {
          openModal('reservation', noti.reservation);
        }
      };

      const sortBy = (k) => { if (sortKey.value === k) sortOrder.value *= -1; else { sortKey.value = k; sortOrder.value = 1; } };
      const toggleBranchFilter = (id) => { const idx = filterBranchIds.value.indexOf(id); if (idx > -1) filterBranchIds.value.splice(idx, 1); else filterBranchIds.value.push(id); };
      const isBranchSelected = (id) => filterBranchIds.value.includes(id);
      const clearBranchFilters = () => filterBranchIds.value = [];
      const prevPage = () => { if (currentPage.value > 1) currentPage.value--; };
      const nextPage = () => { if (currentPage.value < totalPage.value) currentPage.value++; };
      const changeSlotDate = (d) => { currentSlotDate.value = Util.formatDate(Util.addDays(new Date(currentSlotDate.value), d), 'date'); };
      
      const markAsReadOnClick = (res) => {
        if (res && res.is_read === false) {
          res.is_read = true;
          runGoogleScriptSilent('apiMarkReservationAsRead', res.id);
        }
      };
      
      // [Optimistic] 로컬 상태 즉시 반영 후 백그라운드 서버 동기화, 실패 시 롤백
      const handleInlineStatusChange = async (res, field, event) => {
        const newValue = event.target.value;
        let confirmMsg = '';
        if (field === 'status') {
          const statusMap = { 'confirm': '예약 확정', 'cancel': '예약 취소', 'pending': '예약 대기' };
          const statusTxt = statusMap[newValue];

      const generateKakaoMessageData = (res) => {

      const sendKakao = async (e, res) => {

      // [Optimistic] 발송 완료 상태 즉시 반영 후 백그라운드 서버 동기화, 실패 시 롤백
      const confirmKakao = async (e, res) => {

      const confirmDelete = async () => {

      const handleManualRefresh = async () => {

      const refreshInitialData = async (silent) => {
        if(typeof silent === 'undefined') silent = false;

          const promises = [
            runGoogleScriptSilent('apiGetBranches'), runGoogleScriptSilent('apiGetReservations'), runGoogleScriptSilent('apiGetSlotMasters'),
            runGoogleScriptSilent('apiGetSlotDefaults'), runGoogleScriptSilent('apiGetSlotOverrides'), runGoogleScriptSilent('apiGetMailTemplates'),
            runGoogleScriptSilent('apiGetDuplicateGroups'), runGoogleScriptSilent('apiGetBouncedEmails')
          ];

          const results = await Promise.all(promises);

          slotDefaults.value = results[3].data || []; slotOverrides.value = results[4].data || []; mailTemplates.value = results[5].data || [];

        finally { if (!silent) isLoading.value = false; }
      };

      // 예약금 금액: 콤마 자동 포맷 (숫자만 입력, 콤마 삽입/제거 시 커서 위치 보존)
      const depositAmountDisplay = computed(() => {
        if (!activeReservation.value) return '';
        const v = activeReservation.value.deposit_amount;
        if (v === null || v === undefined || v === '') return '';
        const n = Number(v);
        if (isNaN(n)) return '';
        return n.toLocaleString('en-US');
      });
      const handleDepositAmountInput = (e) => {
        const el = e.target;
        const digitsBeforeCursor = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
        const digits = el.value.replace(/\D/g, '');
        const num = digits ? parseInt(digits, 10) : 0;
        if (activeReservation.value) activeReservation.value.deposit_amount = num;
        const formatted = digits ? num.toLocaleString('en-US') : '';
        el.value = formatted;
        let pos = 0, count = 0;
        while (pos < formatted.length && count < digitsBeforeCursor) {
          if (formatted[pos] >= '0' && formatted[pos] <= '9') count++;
          pos++;
        }
        el.setSelectionRange(pos, pos);
      };
      // 콤마를 없는 글자처럼 취급: 화살표는 콤마를 한 번에 건너뛰고, 삭제 키는 콤마가 아닌 인접 숫자를 지움
      const handleDepositAmountKeydown = (e) => {
        const el = e.target;
        if (el.selectionStart !== el.selectionEnd) return;
        const pos = el.selectionStart;
        const val = el.value;
        if (e.metaKey || e.altKey || e.ctrlKey || e.shiftKey) return;
        // 커서 정착 위치는 항상 콤마 왼쪽(숫자 바로 뒤)으로 통일
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          let t = Math.max(0, pos - 1);
          if (t > 0 && val[t - 1] === ',') t -= 1;
          el.setSelectionRange(t, t);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          let t = Math.min(val.length, pos + 1);
          if (val[t - 1] === ',') t += 1;
          t = Math.min(val.length, t);
          el.setSelectionRange(t, t);
        } else if (e.key === 'Backspace' && pos >= 2 && val[pos - 1] === ',') {
          e.preventDefault();
          el.value = val.slice(0, pos - 2) + val.slice(pos - 1);
          el.setSelectionRange(pos - 2, pos - 2);
          el.dispatchEvent(new Event('input', { bubbles: true }));
        } else if (e.key === 'Delete' && val[pos] === ',') {
          e.preventDefault();
          el.value = val.slice(0, pos + 1) + val.slice(pos + 2);
          el.setSelectionRange(pos + 1, pos + 1);
          el.dispatchEvent(new Event('input', { bubbles: true }));
        }
      };

      // 모달 헤더 뱃지 클릭 → 상태 선택 드롭다운 (저장 전 로컬 변경)

      // [Optimistic] 모달/리스트 상태 즉시 반영 후 백그라운드 서버 저장, 실패 시 롤백
      const handleSaveReservation = async () => {
        if (isReservationFormValid.value === false) {
          showCustomAlert("확인", isSelectionInvalid.value ? "시간대 마감" : "입력값 확인"); return;

        const target = reservations.value.find(r => r.id === d.id);
        const listSnapshot = target ? JSON.parse(JSON.stringify(target)) : null;
        const prevOriginal = originalReservation.value ? JSON.parse(JSON.stringify(originalReservation.value)) : null;

        activeReservation.value.reservation_date = newDateIso;
        activeReservation.value.notes = payload.notes;
        activeReservation.value.internal_notes = payload.internal_notes;
        activeReservation.value.private_notes = payload.private_notes;
        if (target) {
          const oldEmail = (listSnapshot && listSnapshot.email) || target.email;

          if (oldEmail && payload.email && oldEmail.trim().toLowerCase() !== payload.email.trim().toLowerCase()) {
            if (bouncedEmailsData.value && bouncedEmailsData.value.length) {
              bouncedEmailsData.value = bouncedEmailsData.value.filter(b =>

              );

        reservations.value = [...reservations.value];
        originalReservation.value = JSON.parse(JSON.stringify(activeReservation.value));
        showToast('저장되었습니다');

        isMutating.value = true;
        runGoogleScriptSilent('apiUpdateReservation', payload)
          .then(res => { if (!res.success) throw new Error(res.message || '저장 실패'); })
          .catch(e => {
            if (target && listSnapshot) Object.assign(target, listSnapshot);

      // 선택 템플릿 본문에 [[alt_ 예약어가 있으면 대체 지점 선택 UI 노출

      const selectedTemplateNeedsDuplicateList = computed(() => {

      watch(selectedMailTemplateId, () => { selectedAltBranchId.value = ''; });

      // --- 중복 의심 및 수동 그룹 핸들러 ---
      const excludeSingleReservationFromGroup = async (res) => {
        const group = activeReservationDuplicateGroup.value;
        if (!group) return;
        const confirmed = await showCustomConfirm('중복 제외', `${res.customer_name} 건을 중복 그룹에서 제외하시겠습니까?`);

      const handleRemoveManualGroup = async (group) => {

      // --- 중복예약 확인메일 발송 모달 & 스레드 선택 로직 ---

      // --- 중복 그룹별 접기/펼치기 로직 ---

      const initializeMailThread = async () => {

      const handleCorrectEmailAndSendConfirmation = async () => {
        if (!activeReservation.value) return;

        const confirmed = await showCustomConfirm(

        );
        if (!confirmed) return;

        try {
          isModalLoading.value = true;
          const oldEmail = activeReservation.value.email;
          const oldThreadId = activeReservation.value.email_thread_id;
          const branch = branches.value.find(b => b.id === activeReservation.value.branch_id) || {};
          const payload = {
            reservationId: activeReservation.value.id,
            newEmail: targetEmail,
            data: {
              ...activeReservation.value,
              email: targetEmail,
              branch_name_en: branchMapEn.value[activeReservation.value.branch_id],
              branch_address: branch.address || '',
              branch_google_link: branch.google_map_link || ''
            }
          };

          const res = await runGoogleScriptSilent('apiCorrectEmailAndInitializeThread', payload);
          if (res.success) {
            activeReservation.value.email = res.data.email;
            activeReservation.value.email_thread_id = res.data.threadId;
            if (originalReservation.value) {
              originalReservation.value.email = res.data.email;
              originalReservation.value.email_thread_id = res.data.threadId;
            }

            const targetIdx = reservations.value.findIndex(r => r.id === activeReservation.value.id);
            if (targetIdx > -1) {
              reservations.value[targetIdx].email = res.data.email;
              reservations.value[targetIdx].email_thread_id = res.data.threadId;
            }

            // [Optimistic UI] 이전 반송(bounce) 기록에서 즉시 제거하여 필터 뱃지 카운트 즉각 갱신
            if (bouncedEmailsData.value && bouncedEmailsData.value.length) {
              bouncedEmailsData.value = bouncedEmailsData.value.filter(b => 
                (oldThreadId ? b.threadId !== oldThreadId : true) &&
                (oldEmail ? (b.recipientEmail || '').trim().toLowerCase() !== oldEmail.trim().toLowerCase() : true)

            reservations.value = [...reservations.value];

            showCustomAlert("완료", "이메일 주소가 성공적으로 변경되었으며, 고객에게 예약 확인서 메일 발송 및 신규 스레드 생성이 완료되었습니다.");

            // 백그라운드 라벨 추가 (예약 상태 및 예약금 상태 싱크)
            runGoogleScriptSilent('apiAddLabelsToThread', {
              threadId: res.data.threadId,
              pax: activeReservation.value.pax,
              status: activeReservation.value.status,
              deposit_status: activeReservation.value.deposit_status,
              reservationId: activeReservation.value.id
            }).catch(e => console.warn("Background label addition failed:", e));

            await refreshInitialData(true);
          } else {
            showCustomAlert("실패", res.message);
          }
        } catch (e) {
          showCustomAlert("오류", e.message);
        } finally {
          isModalLoading.value = false;
        }
      };

      // ============================================================
      // [MODIFIED] Summernote Integration (Badge & Auto-Detect)
      // ============================================================
      
      // 1. 뱃지 생성 함수 (No brackets)
      const createBadgeNode = (keyword) => {
        const span = document.createElement('span');
        span.className = 'custom-badge';
        span.innerText = keyword; // [FIX] No brackets in visual editor
        span.setAttribute('contenteditable', 'false'); 
        span.setAttribute('data-value', keyword);
        return span;
      };

      // 2. 텍스트를 뱃지 HTML로 변환 (초기 로딩용)
      // HTML 태그 내부(href 등 속성 안)의 [[key]]는 변환하지 않음 — 속성 안에 span이 들어가면 HTML이 깨짐
      const convertTextToBadgeHtml = (html) => {
        if (!html) return '';
        return html.split(/(<[^>]*>)/g).map(part => {
          if (part.startsWith('<')) return part;
          return part.replace(/\[\[(.*?)\]\]/g, (match, kw) => {
            return `<span class="custom-badge" contenteditable="false" data-value="${kw}">${kw}</span>`;
          });
        }).join('');
      };

      const initSummernote = () => {
        if (typeof $ === 'undefined' || !$.fn.summernote) {
          console.warn("Summernote or jQuery not loaded.");
          return;
        }

        if ($('#mail-summernote').next('.note-editor').length > 0) {
          $('#mail-summernote').summernote('destroy');
        }
        
        $('#mail-summernote').summernote({
          height: 300,
          lang: 'ko-KR',
          placeholder: '내용을 입력하세요...',
          toolbar: [
            ['style', ['style']],
            ['font', ['bold', 'italic', 'underline', 'clear']],
            ['color', ['color']],
            ['para', ['ul', 'ol', 'paragraph']],
            ['table', ['table']],
            ['insert', ['link', 'hr']],
            ['view', ['fullscreen', 'codeview', 'help']]
          ],
          callbacks: {
            onChange: function(contents) {
              localMailData.value.body_html = contents;
            },
            // [NEW] Track Focus
            onFocus: () => { isEditorFocused.value = true; },
            onBlur: () => { isEditorFocused.value = false; },
            // 키 입력 감지 (Auto-Detect)
            onKeyup: function(e) {
              // [BUGFIX] Enter 키(13) 입력 시 빈 뱃지(empty span.custom-badge) 제거
              if (e.keyCode === 13) {
                const $editable = $(e.target).closest('.note-editable');
                if ($editable.length) {
                  $editable.find('.custom-badge').each(function() {
                    // 텍스트가 비어있거나 공백만 있는 경우 제거
                    if ($(this).text().trim() === '') {
                      $(this).remove();
                    }
                  });
                }
              }

              if (e.keyCode === 32 || e.keyCode === 13) {
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                  const range = selection.getRangeAt(0);
                  const textNode = range.endContainer;
                  if (textNode.nodeType === 3) {
                    const textContent = textNode.textContent;
                    const regex = /\[\[([a-zA-Z0-9_]+)\]\]\s$/;
                    const match = textContent.match(regex);
                    if (match) {
                      const keyword = match[1];
                      const newText = textContent.replace(regex, '');
                      textNode.textContent = newText;
                      const badge = createBadgeNode(keyword);
                      range.insertNode(badge);
                      const space = document.createTextNode('\u00A0');
                      range.insertNode(space);
                      range.setStartAfter(space);
                      range.setEndAfter(space);
                      selection.removeAllRanges();
                      selection.addRange(range);
                    }
                  }
                }
              }
            }
          }
        });
        
        let initialHtml = localMailData.value.body_html || '';
        initialHtml = convertTextToBadgeHtml(initialHtml);
        $('#mail-summernote').summernote('code', initialHtml);
      };

      const togglePreview = () => {
        isPreviewMode.value = !isPreviewMode.value;
        if (isPreviewMode.value) {
          if (typeof $ !== 'undefined' && $.fn.summernote) {
            const code = $('#mail-summernote').summernote('code');
            localMailData.value.body_html = code;
          }
        } else {
          nextTick(() => {
            initSummernote();
          });
        }
      };

      // 시스템/메일 모달 더티 체크 (저장 버튼 활성화 제어)
      const originalSystemState = ref('');
      const currentSystemStateString = () => {
        const d = activeSystemData.value;
        if (!d) return '';
        if (d.type === 'slot' && d.mode === 'batch') return JSON.stringify(slotBatchPayload.masterSlots);
        if (d.type === 'user') return JSON.stringify(localData.value) + JSON.stringify(userBranchIds.value.slice().sort());
        return JSON.stringify(localData.value);
      };
      const isSystemDirty = computed(() => modalState.system && originalSystemState.value !== currentSystemStateString());

      const normalizeMailBody = (html) => (html || '').replace(/<span class="custom-badge"[^>]*data-value="([^"]+)"[^>]*>.*?<\/span>/g, '[[$1]]');
      const originalMailState = ref('');
      const currentMailStateString = () => JSON.stringify({
        n: localMailData.value.template_name || '',
        b: normalizeMailBody(localMailData.value.body_html)
      });
      const isMailDirty = computed(() => modalState.mail && originalMailState.value !== currentMailStateString());

      // Settings Watchers & Handlers
      watch(activeSystemData, (d) => {
        if (d) { 
          localData.value = d.data ? JSON.parse(JSON.stringify(d.data)) : {};
          if (d.type === 'branch') {
            // 시트에 아직 컬럼이 없어 undefined인 신규 필드는 빈 문자열로 정규화 (더티 체크 오탐 방지)
            if (localData.value.address === undefined) localData.value.address = '';
            if (localData.value.google_map_link === undefined) localData.value.google_map_link = '';
          }
          if (d.type === 'user') {
            userBranchIds.value = d.mode === 'create' ? [] : (d.data?.branch_ids || []);
            if(d.mode === 'create') localData.value = { id: null, user_email: '', user_name: '', role: 'manager', enabled: true, branch_ids: [] };
          } else if (d.type === 'slot' && d.mode === 'batch') {
            if (d.masterSlots) slotBatchPayload.masterSlots = d.masterSlots.map(s => ({ ...s }));
          } else if (d.type === 'mail') {
            // [MODIFIED] Create mode handling
            if (d.mode === 'create') {
              // Create mode initialization
              localMailData.value = { id: '', template_name: '', body_html: '', enabled: true };
              isPreviewMode.value = false;
              nextTick(() => { 
                if (document.getElementById('mail-summernote')) initSummernote(); 
              });
            } else if (d.data) {
              localMailData.value = JSON.parse(JSON.stringify(d.data));
              isPreviewMode.value = false;
              nextTick(() => { 
                if (document.getElementById('mail-summernote')) initSummernote(); 
              });
            }
          }
          if (d.mode) {
            if (d.type === 'user') modalTitle.value = d.mode === 'create' ? '사용자 추가' : '사용자 수정';
            else if (d.type === 'branch') modalTitle.value = '지점 수정';
            else if (d.type === 'slot') {
              if (d.mode === 'batch') modalTitle.value = d.batchType === 'override' ? '커스텀 슬롯 설정' : '기본 슬롯 설정';
              else modalTitle.value = '커스텀 슬롯 설정'; 
            } else if (d.type === 'mail') {
              // [MODIFIED] Set title based on mode
              modalTitle.value = d.mode === 'create' ? '새 메일 템플릿' : '메일 템플릿 수정';
            }
          }
          // 더티 체크 기준 스냅샷 갱신
          nextTick(() => {
            originalSystemState.value = currentSystemStateString();
            originalMailState.value = currentMailStateString();
          });
        }
      }, { deep: true });

      // [Optimistic] 슬롯 저장 시 로컬 메모리(slotDefaults/slotOverrides)에 즉시 반영
      const applySlotOptimistic = (apiType, d) => {
        const upsertOverride = (branchId, masterId, dateStr, slot, enabled, reason) => {
          const ov = slotOverrides.value.find(o =>
            o.branch_id === branchId &&
            String(o.slot_master_id) === String(masterId) &&
            Util.formatDate(o.date, 'date') === dateStr
          );
          if (ov) {
            ov.slot = Number(slot);
            ov.enabled = enabled;
            if (reason !== undefined) ov.reason = reason;
          } else {
            slotOverrides.value.push({ id: null, branch_id: branchId, slot_master_id: masterId, date: dateStr, slot: Number(slot), enabled: enabled, reason: reason || '' });
          }
        };

        if (apiType === 'slot_override') {
          upsertOverride(d.branch_id, d.slot_master_id, d.date, d.slot, d.enabled, d.reason);
        } else if (apiType === 'slot_override_batch') {
          Object.keys(d.payload).forEach(mid => {
            const v = d.payload[mid];
            upsertOverride(d.branch_id, mid, d.date, v.slot, v.enabled);
          });
        } else if (apiType === 'slot_batch') {
          Object.keys(d.payload).forEach(mid => {
            const v = d.payload[mid];
            const def = slotDefaults.value.find(x => x.branch_id === d.branch_id && String(x.slot_master_id) === String(mid));
            if (def) { def.slot = Number(v.slot); def.enabled = v.enabled; }
            else slotDefaults.value.push({ branch_id: d.branch_id, slot_master_id: mid, slot: Number(v.slot), enabled: v.enabled });
          });
        }
      };

      const handleSystemSave = async () => {
        let d = localData.value;
        let type = activeSystemData.value.type;
        let apiType = type;
        if (type === 'user') d.branch_ids = userBranchIds.value;
        else if (type === 'slot' && activeSystemData.value.mode === 'edit') apiType = 'slot_override';
        else if (type === 'slot' && activeSystemData.value.mode === 'batch') {
          const isOverride = activeSystemData.value.batchType === 'override';
          if (isOverride) {
            apiType = 'slot_override_batch';
            const branchId = activeSystemData.value.data.branch_id; 
            const targetDate = activeSystemData.value.data.date;
            const payload = slotBatchPayload.masterSlots.reduce((acc, s) => {
              acc[s.id] = { slot: Number(s.slot), enabled: s.enabled };
              return acc;
            }, {});
            d = { branch_id: branchId, date: targetDate, payload: payload };
          } else {
            apiType = 'slot_batch';
            const payload = slotBatchPayload.masterSlots.reduce((acc, s) => { acc[s.id] = { slot: Number(s.slot), enabled: s.enabled }; return acc; }, {});
            d = { branch_id: activeSystemData.value.data.branch_id, payload: payload };
          }
        }
        
        const isSlotSave = apiType === 'slot_override' || apiType === 'slot_batch' || apiType === 'slot_override_batch';
        if (isSlotSave) {
          const defaultsSnapshot = JSON.parse(JSON.stringify(slotDefaults.value));
          const overridesSnapshot = JSON.parse(JSON.stringify(slotOverrides.value));

          applySlotOptimistic(apiType, d);
          closeModal('system');
          showCustomAlert("저장 요청 완료", "변경사항이 관리자 화면에 즉시 반영되었습니다.\n\n실제 예약 사이트(위젯 캘린더)에는 반영되는 데 최대 몇 분이 걸릴 수 있습니다. 잠시 후 예약 사이트에 직접 접속하여 슬롯 상태가 정상 반영되었는지 확인해주세요.\n\n서버 저장에 실패할 경우 화면은 자동으로 변경 전 상태로 되돌아갑니다.");

          isMutating.value = true;
          runGoogleScriptSilent('apiSaveSystemSettings', apiType, d)
            .then(res => { if (!res.success) throw new Error(res.message || '저장 실패'); })
            .catch(e => {
              slotDefaults.value = defaultsSnapshot;
              slotOverrides.value = overridesSnapshot;
              showCustomAlert("저장 실패", "슬롯 저장에 실패하여 변경 전 상태로 되돌렸습니다.\n" + e.message);
            })
            .finally(() => { isMutating.value = false; });
          return;
        }

        isModalLoading.value = true;
        try {
          const res = await runGoogleScriptSilent('apiSaveSystemSettings', apiType, d);
          if (res.success) { showCustomAlert("완료", "저장됨"); await refreshInitialData(); closeModal('system'); }
          else showCustomAlert("오류", res.message);
        } catch(e) {
          showCustomAlert("오류", e.message);
        } finally {
          isModalLoading.value = false;
        }
      };
      
      // 슬롯 일괄수정 프리셋: 기준 시각(17시) 이전/이후 시간대를 슬롯 0 / 활성화 ON으로 일괄 마감
      const applySlotBatchPreset = (type) => {
        slotBatchPayload.masterSlots.forEach(s => {
          const t = slotMasterMap.value[s.id] || '';
          const hour = parseInt(String(t).split(':')[0], 10);
          if (isNaN(hour)) return;
          const isAfternoon = hour >= 17;
          if ((type === 'afternoon' && isAfternoon) || (type === 'lunch' && !isAfternoon)) {
            s.slot = 0;
            s.enabled = true;
          }
        });
      };

      const openSlotBatchModal = (type) => {
        const branchId = selectedSlotBranchId.value;
        const date = currentSlotDate.value;
        if (!branchId) { showCustomAlert("알림", "지점을 선택해주세요."); return; }
        if (type === 'override' && !date) { showCustomAlert("알림", "날짜를 선택해주세요."); return; }
        openModal('system', { 
          type: 'slot', mode: 'batch', batchType: type,
          data: { branch_id: branchId, date: (type === 'override') ? date : null } 
        });
      };
      
      const openSlotEditModal = (branchId, masterId, date, isOverride) => {
        const info = getSlotInfo(branchId, masterId, date);
        const existingData = info.isOverrideData || {};
        
        openModal('system', { 
          type: 'slot', mode: 'edit', 
          data: { 
            id: existingData.id || null,
            branch_id: branchId, 
            slot_master_id: masterId, 
            date: date, 
            slot: existingData.slot !== undefined ? existingData.slot : (info.value !== '-' ? info.value : 0),
            reason: existingData.reason || '',
            enabled: existingData.enabled !== undefined ? existingData.enabled : false,
            isOverride: isOverride 
          } 
        });
      };

      const isValidKeyword = (key) => availableKeywords.includes(key);

      const handleMailSave = async () => {
        let currentHtml = localMailData.value.body_html;
        if (!isPreviewMode.value && typeof $ !== 'undefined' && $.fn.summernote) {
            currentHtml = $('#mail-summernote').summernote('code');
        }
        
        if (!localMailData.value.template_name || !localMailData.value.template_name.trim()) {
          alert('템플릿 제목을 입력해주세요.'); return;
        }
        if (!currentHtml || currentHtml === '<p><br></p>') {
          alert('메일 본문을 입력해주세요.'); return;
        }
        
        // [FIX] Convert badge spans back to [[key]] format for DB saving
        const cleanHtml = currentHtml.replace(/<span class="custom-badge"[^>]*data-value="([^"]+)"[^>]*>.*?<\/span>/g, '[[$1]]');
        
        const payload = { 
          id: localMailData.value.id, 
          template_name: localMailData.value.template_name, 
          body_html: cleanHtml 
        };

        // [MODIFIED] Use modal-specific loading state instead of global
        isModalLoading.value = true;

        try {
          // [MODIFIED] Use silent execution to avoid global overlay
          const res = await runGoogleScriptSilent('apiSaveSystemSettings', 'mail_template', payload);
          
          if (res.success) { 
            // [MODIFIED] Success logic: No alert, keep modal, refresh data silently
            await refreshInitialData(true);

            // Update local model with refreshed data
            // If ID was missing (create mode), try to find the newly created item
            // Usually res.data contains the saved record, if supported by backend.
            // Assuming backend might not return the full object, we find it in the refreshed list.
            const found = mailTemplates.value.find(t => t.template_name === payload.template_name);
            if (found) {
              localMailData.value = JSON.parse(JSON.stringify(found));
              
              // Switch to edit mode if it was create
              if (activeSystemData.value.mode === 'create') {
                activeSystemData.value.mode = 'edit';
                modalTitle.value = '메일 템플릿 수정';
              }
            }
            originalMailState.value = currentMailStateString();
          } 
          else {
            // [MODIFIED] Show alert only on failure
            showCustomAlert("오류", res.message);
          }
        } catch (e) {
          showCustomAlert("오류", e.message);
        } finally {
          isModalLoading.value = false;
        }
      };
      
      const insertPlaceholder = (k) => { 
        // [NEW] Only insert if editor has focus
        if (!isEditorFocused.value) return;

        const badge = createBadgeNode(k);
        $('#mail-summernote').summernote('insertNode', badge);
        $('#mail-summernote').summernote('insertText', '\u00A0');
      };

      const renderPreview = (htmlContent) => {
        if (!htmlContent) return '';
        let processed = htmlContent;
        const sampleData = {
          customer_name: 'John Doe',
          branch_name_en: 'Hansik Wangbijib Euljiro Branch',
          pax: '4',
          reservation_date: 'Jan 1',
          reservation_time: '18:30',
          deposit_amount: '100',
          deposit_url: 'https://example.deposit.url',
          branch_address: '21 Myeongdong 7-gil, Jung District, Seoul, South Korea',
          branch_google_link: 'https://maps.app.goo.gl/WqvmgHYLK3oDV7588',
          alt_branch_name_en: 'Wangbijib Myeongdong 2nd Branch',
          alt_branch_address: '13 Myeongdong 9-gil, Jung District, Seoul, South Korea',
          alt_branch_google_link: 'https://maps.app.goo.gl/ZcGAMDWPsUfL9D6i6',
        };
        
        // 1. [FIX] Handle existing badge spans (from Editor)
        // Find badges by class/data-value and replace with bolded sample data
        processed = processed.replace(/<span class="custom-badge"[^>]*data-value="([^"]+)"[^>]*>.*?<\/span>/g, (match, keyword) => {
          if (isValidKeyword(keyword)) {
            const displayValue = sampleData[keyword] || keyword;
            return `<span class="custom-badge">${displayValue}</span>`;
          }
          return match;
        });

        // 2. Handle raw brackets (fallback for DB loaded data not yet in editor)
        // 태그 내부(href 등 속성)의 [[key]]는 span 없이 순수 값으로 치환해 미리보기에서 링크가 실제로 동작하게 함
        processed = processed.split(/(<[^>]*>)/g).map(part => {
          const isTag = part.startsWith('<');
          return part.replace(/\[\[(.*?)\]\]/g, (match, keyword) => {
            if (!isValidKeyword(keyword)) return match;
            const displayValue = sampleData[keyword] || keyword;
            return isTag ? displayValue : `<span class="custom-badge">${displayValue}</span>`;
          });
        }).join('');
        
        return `<div class="prose max-w-none">${processed}</div>`;
      };

      const initApp = async () => {
        try {
          loadingMessage.value = '유저 정보 확인 중...';
          const auth = await runGoogleScript('apiCheckSession');
          if (!auth.success) { appState.value = 'denied'; deniedMessage.value = auth.message; return; }
          currentUser.value = auth.data;
          if (currentUser.value.role === 'viewer') currentView.value = 'list';

          const todayObj = new Date();
          const yesterdayObj = Util.addDays(todayObj, -1);
          const todayStr = Util.formatDate(todayObj, 'date');
          const yesterdayStr = Util.formatDate(yesterdayObj, 'date');

          if (currentUser.value.role === 'viewer') {
            filterDateType.value = 'reservation_date'; filterDateStart.value = todayStr; filterDateEnd.value = todayStr;
            sortKey.value = 'reservation_date'; sortOrder.value = 1;
          } else {
            filterDateType.value = 'booking_request_date'; filterDateStart.value = yesterdayStr; filterDateEnd.value = todayStr;
            sortKey.value = 'booking_request_date'; sortOrder.value = -1;
          }

          await refreshInitialData(false);
          appState.value = 'authorized';
          
          window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
              // 1. Alert/Confirm 팝업 (최상위 레이어 z-[1000])
              if (alertModal.isOpen) {
                e.preventDefault();
                e.stopPropagation();
                handleAlertResult(alertModal.isConfirm ? false : true);
                return;
              }

              // 스피너나 메일 발송 로딩 중일 때는 ESC 무시
              if (isModalLoading.value || isSendingDuplicateMail.value) {
                e.preventDefault();
                return;
              }

              // 2. 중복확인 메일 스레드 선택 서브모달 (z-[60])
              if (modalState.duplicateMail) {
                e.preventDefault();
                e.stopPropagation();
                closeDuplicateMailModal();
                return;
              }

              // 3. 모달 내부 상태 드롭다운 또는 헤더 드롭다운이 열려있는 경우
              if (isStatusDropdownOpen.value) {
                e.preventDefault();
                e.stopPropagation();
                isStatusDropdownOpen.value = false;
                return;
              }
              if (isProfileDropdownOpen.value) {
                e.preventDefault();
                e.stopPropagation();
                isProfileDropdownOpen.value = false;
                return;
              }
              if (isNotificationOpen.value) {
                e.preventDefault();
                e.stopPropagation();
                isNotificationOpen.value = false;
                return;
              }
              if (isMobileMenuOpen.value) {
                e.preventDefault();
                e.stopPropagation();
                isMobileMenuOpen.value = false;
                return;
              }

              // 4. 기본 모달 레이어 (z-50)
              if (modalState.reservation) {
                e.preventDefault();
                e.stopPropagation();
                closeModal('reservation');
                return;
              }
              if (modalState.system) {
                e.preventDefault();
                e.stopPropagation();
                closeModal('system');
                return;
              }
              if (modalState.mail) {
                e.preventDefault();
                e.stopPropagation();
                closeModal('mail');
                return;
              }
            }
          });
          
          setInterval(async () => {
            if (appState.value !== 'authorized' || modalState.system || modalState.mail || isMutating.value) return;
            if (isSyncing.value) return;
            
            syncCountdown.value--;
            if (syncCountdown.value <= 0) {
              syncCountdown.value = 60;
              try {
                const syncStartedAt = Date.now();
                const res = await runGoogleScriptSilent('apiGetReservations');
                // [Race Guard] 응답 대기 중 뮤테이션이 발생했다면 이 응답은 취소/저장 이전의 구버전 데이터일 수 있으므로 폐기
                if (isMutating.value || lastMutationCompletedAt > syncStartedAt) {
                  console.warn('[Sync] 뮤테이션과 경합 감지 → 이번 동기화 응답 폐기');
                } else if (res.success) {
                  // [Fix] 동기화 시 로컬에서 이미 읽음(is_read=true) 처리된 상태라면 서버의 과거 데이터(false)를 무시하고 로컬 상태 유지
                  res.data.forEach(serverRes => {
                    const localRes = reservations.value.find(r => r.id === serverRes.id);
                    if (localRes && localRes.is_read === true) {
                      serverRes.is_read = true;
                    }
                  });
                  reservations.value = res.data;
                  
                  // [Sync] 모달이 열려있는 경우 해당 예약의 정보(threadId 등)를 업데이트
                  if (modalState.reservation && activeReservation.value) {
                    const freshRes = res.data.find(r => r.id === activeReservation.value.id);
                    if (freshRes && freshRes.email_thread_id && !activeReservation.value.email_thread_id) {
                      activeReservation.value.email_thread_id = freshRes.email_thread_id;
                      console.log(`[Sync] Updated threadId for active modal: ${freshRes.email_thread_id}`);
                    }
                  }
                }
              } catch (e) { console.warn("Sync failed", e); }
            }
          }, 1000);
        } catch(e) { console.error(e); alert('초기화 오류: ' + e.message); } finally { if(appState.value !== 'initializing') isLoading.value = false; }
      };

      let clockInterval = null;
      onMounted(() => {
        initApp();
        document.addEventListener('click', () => {
          isProfileDropdownOpen.value = false;
          isNotificationOpen.value = false;
          isStatusDropdownOpen.value = false;
        });
        clockInterval = setInterval(() => {
          now.value = new Date();
        }, 60000);
      });

      onUnmounted(() => {
        if (clockInterval) {
          clearInterval(clockInterval);
        }
      });

      return {
        pullDistance, isPulling, isRefreshing, handleTouchStart, handleTouchMove, handleTouchEnd,
        pullThresholdReached, pullIndicatorHeight, hasMultiplePages,
        isLoading, loadingMessage, appState, deniedMessage, currentView, currentUser, isModalLoading, syncCountdown, isSyncing,
        isProfileDropdownOpen, isNotificationOpen, isMutating, isMobileMenuOpen, logoutUrl, refundOrderUrl, refundTarget, modalState, alertModal,
        activeReservation, activeSystemData,
        reservations, branches, users, mailTemplates, duplicateGroupsData, slotMasters, slotDefaults, slotOverrides,
        filterText, filterStatus, filterDeposit, filterBranchIds, filterDateType, filterDateStart, filterDateEnd,
        filterIssueType, selectedReservationIds,
        sortKey, sortOrder, currentPage, itemsPerPage,
        settingsTab, currentSlotDate, selectedSlotBranchId, selectedCalendarBranchId,
        filteredReservations, paginatedReservations, totalPage, branchMapKo, branchMapEn, slotSettingsBranches, filteredSlotBranches,
        activeCalendarId, calendarIframeSrc, slotMasterMap,
        notifications, notificationCount,
        emailErrorReservations, duplicateGroups, duplicateGroupTotalCount, duplicateGroupMap, activeReservationDuplicateGroup,
        bouncedEmailsData, activeReservationIsBounced, activeReservationEmailError, isBouncedReservation, getReservationEmailError,
        isAllVisibleSelected, toggleSelectAllVisible, toggleIssueFilter,
        validateEmail, hasEmailError, getEmailErrorMsg, getEmailSuggestion, activeReservationEmailSuggestion, applyEmailSuggestion,
        handleCorrectEmailAndSendConfirmation,
        excludeSingleReservationFromGroup, clearDuplicateGroup, handleRemoveManualGroup, handleCreateManualDuplicateGroup,
        targetDuplicateMailGroup, selectedDuplicateTargetResId, isSendingDuplicateMail,
        selectedDuplicateTargetReservation, hasSelectableThreadInGroup,
        openDuplicateMailModal, closeDuplicateMailModal, submitDuplicateConfirmationMail,
        collapsedGroupMap, toggleGroupCollapse, areAllGroupsCollapsed, toggleAllGroupsCollapse,
        setCurrentView, setCurrentViewAndCloseMenu, toggleProfileDropdown, toggleNotificationDropdown, toggleMobileMenu, 
        runGoogleScript, openModal, closeModal, showCustomAlert, showCustomConfirm, handleAlertResult,
        refreshInitialData, handleManualRefresh, formatDate: Util.formatDate,
        getBranchName, getDepositStatusLabel, getDepositBadgeClass, sortBy, toggleBranchFilter, isBranchSelected, clearBranchFilters,
        handleInlineStatusChange, sendKakao, confirmKakao, markAsReadOnClick,
        prevPage, nextPage, getUserRoleBadge, confirmDeleteUser, 
        changeSlotDate, getSlotValue, isSlotOverride, getSlotDisplayClass, getSlotTime, getSlotInfo,
        isSlotFull, hasFilterBranches,
        safeChar: Util.safeChar,
        openReservationModal: (r) => openModal('reservation', r),
        openUserModal: (mode, data = null) => openModal('system', { type: 'user', mode, data }),
        openBranchModal: (data) => openModal('system', { type: 'branch', mode: 'edit', data }),
        openSlotEditModal,
        openSlotBatchModal, applySlotBatchPreset,
        handleNotificationClick,
        openMailTemplateModal: (t = null) => openModal('mail', { type: 'mail', mode: t ? 'edit' : 'create', data: t }),
        localDateTime, selectedMailTemplateId, selectedAltBranchId, selectedTemplateNeedsAltBranch, selectedTemplateNeedsDuplicateList, altBranchOptions, localData, userBranchIds, slotBatchPayload, localMailData, availableKeywords, modalTitle, 
        isSelectionInvalid, isPaxInvalid, isTimeEmpty, isReservationFormValid, isReservationDirty, isSystemDirty, isMailDirty, toast, cellTip, showCellTip, hideCellTip, copyToClipboard,
        handleSaveReservation, isStatusDropdownOpen, toggleStatusDropdown, setReservationStatus, depositAmountDisplay, handleDepositAmountInput, handleDepositAmountKeydown, sendCustomMail, initializeMailThread, handleSystemSave, confirmDelete, confirmDeleteMailTemplate, handleMailSave, insertPlaceholder,
        renderPreview, isPreviewMode, togglePreview,
        BASE_WEBAPP_URL, appVersion, appLogo
      };
    }
  });

  app.directive('autogrow', {
    mounted(el) {
      el.style.overflowY = 'hidden';
      el.style.resize = 'none';
      autoGrowResize(el);
      el.addEventListener('input', function() { autoGrowResize(el); });
    },
    updated(el) { autoGrowResize(el); }
  });

  app.mount('#app');
</script>
