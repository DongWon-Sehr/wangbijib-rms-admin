<div class="h-full flex flex-col bg-white rounded-xl shadow overflow-hidden">
  <div class="p-4 border-b border-gray-200 flex flex-col md:flex-row md:items-center gap-3">
    <div class="md:mr-auto">
      <h2 class="text-xl font-bold text-gray-800">작업 내역</h2>
      <p class="text-xs text-gray-500 mt-1">최근 200건의 변경·발송 작업을 표시합니다.</p>
    </div>
    <input v-model="activitySearch" type="search" placeholder="담당자·작업·대상 검색"
      class="w-full md:w-64 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-primary-500 focus:border-primary-500">
    <select v-model="activityStatus" class="w-full md:w-28 border border-gray-300 rounded-lg px-3 py-2 text-sm">
      <option value="all">전체 결과</option>
      <option value="완료">완료</option>
      <option value="실패">실패</option>
    </select>
    <button @click="refreshActivityLogs" :disabled="activityLoading" class="w-full md:w-auto px-3 py-2 border border-gray-300 rounded-lg text-sm font-semibold text-gray-700 hover:bg-gray-50 disabled:opacity-50 whitespace-nowrap">
      <i class="ph ph-arrow-clockwise mr-1"></i>{{ activityLoading ? '불러오는 중...' : '새로고침' }}
    </button>
  </div>
  <div class="flex-1 overflow-auto">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50 sticky top-0 z-10">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">일시</th>
          <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">담당자</th>
          <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">작업</th>
          <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">대상</th>
          <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 whitespace-nowrap">내용</th>
          <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 whitespace-nowrap">결과</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr v-for="log in filteredActivityLogs" :key="log.id" class="hover:bg-gray-50">
          <td class="px-4 py-3 text-gray-600 whitespace-nowrap">{{ formatDate(log.timestamp, 'datetime') }}</td>
          <td class="px-4 py-3"><div class="font-semibold text-gray-800">{{ log.actor_name || log.actor_email }}</div><div class="text-xs text-gray-500">{{ log.actor_email }}</div></td>
          <td class="px-4 py-3 font-semibold text-gray-800 whitespace-nowrap">{{ log.action }}</td>
          <td class="px-4 py-3 text-gray-700">{{ log.target || '-' }}</td>
          <td class="px-4 py-3 text-gray-600">{{ log.details || '-' }}</td>
          <td class="px-4 py-3 text-center"><span class="px-2 py-1 rounded-full text-xs font-semibold whitespace-nowrap" :class="log.status === '완료' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">{{ log.status }}</span></td>
        </tr>
        <tr v-if="filteredActivityLogs.length === 0"><td colspan="6" class="px-4 py-12 text-center text-gray-500">표시할 작업 내역이 없습니다.</td></tr>
      </tbody>
    </table>
  </div>
</div>
